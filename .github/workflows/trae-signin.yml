name: TRAE Signin Docker Image CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'trae-signin/**'
      - '.github/workflows/trae-signin.yml'
  schedule:
    # 05:15 UTC = 13:15 北京时间，避开其他镜像的构建时间
    - cron: "15 5 * * *"

env:
  DOCKER_REPOSITORY: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_NAME: trae-signin
  TRAE_SIGNIN_REPO: https://github.com/zhuwenbing/trae-signin.git
  TRAE_SIGNIN_REF: main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare
        id: prepare
        run: |
          TAGS="${{ env.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest,${{ env.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:${GITHUB_SHA::7}"
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./trae-signin
          file: ./trae-signin/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.prepare.outputs.tags }}
          build-args: |
            TRAE_SIGNIN_REPO=${{ env.TRAE_SIGNIN_REPO }}
            TRAE_SIGNIN_REF=${{ env.TRAE_SIGNIN_REF }}
            CACHEBUST=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Clear
        if: always()
        run: |
          rm -rf ${HOME}/.docker/config.json
