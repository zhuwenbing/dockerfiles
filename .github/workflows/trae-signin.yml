name: TRAE Signin Docker Image CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'trae-signin/**'
      - '.github/workflows/trae-signin.yml'
  schedule:
    # 05:15 UTC = 13:15 北京时间，避开其他镜像的构建时间
    # 每天只做检查：基础镜像无变化且上游源码未变时不会构建
    - cron: "15 5 * * *"

env:
  DOCKER_REPOSITORY: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_NAME: trae-signin
  TRAE_SIGNIN_REPO: https://github.com/zhuwenbing/trae-signin.git
  TRAE_SIGNIN_REF: main
  BASE_IMAGE: alpine:3.21

jobs:
  check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      needs-updating: ${{ steps.result.outputs.needs-updating }}
      source-sha: ${{ steps.upstream.outputs.sha }}

    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Check base image update
        id: base
        uses: lucacome/docker-image-update-checker@v3.1.3
        with:
          base-image: ${{ env.BASE_IMAGE }}
          image: ${{ env.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
          platforms: linux/amd64,linux/arm64
        continue-on-error: true

      - name: Get trae-signin upstream SHA
        id: upstream
        run: |
          SHA=$(git ls-remote "$TRAE_SIGNIN_REPO" "refs/heads/$TRAE_SIGNIN_REF" | cut -f1)
          if [[ -z "$SHA" ]]; then
            echo "无法获取上游仓库 SHA: $TRAE_SIGNIN_REPO ($TRAE_SIGNIN_REF)" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Check source image tag
        id: source
        run: |
          TAG="$DOCKER_REPOSITORY/$IMAGE_NAME:src-${{ steps.upstream.outputs.short }}"
          if docker buildx imagetools inspect "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to build
        id: result
        run: |
          BASE="${{ steps.base.outputs.needs-updating }}"
          if [[ "${{ steps.base.outcome }}" != "success" || -z "$BASE" ]]; then
            # 检查器异常时保守处理，避免漏掉基础镜像更新
            BASE="true"
          fi
          SOURCE="${{ steps.source.outputs.exists }}"
          if [[ "$BASE" == "true" || "$SOURCE" != "true" ]]; then
            echo "needs-updating=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs-updating=false" >> "$GITHUB_OUTPUT"
          fi
          echo "base-update=$BASE source-tag-exists=$SOURCE"

  build:
    needs: check
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'schedule' ||
      needs.check.outputs.needs-updating == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare
        id: prepare
        run: |
          SHA="${{ needs.check.outputs.source-sha }}"
          if [[ -z "$SHA" ]]; then
            SHA=$(git ls-remote "$TRAE_SIGNIN_REPO" "refs/heads/$TRAE_SIGNIN_REF" | cut -f1)
          fi
          echo "source-sha=$SHA" >> "$GITHUB_OUTPUT"
          TAGS="$DOCKER_REPOSITORY/$IMAGE_NAME:latest"
          TAGS+=",$DOCKER_REPOSITORY/$IMAGE_NAME:src-${SHA:0:7}"
          TAGS+=",$DOCKER_REPOSITORY/$IMAGE_NAME:${GITHUB_SHA::7}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./trae-signin
          file: ./trae-signin/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.prepare.outputs.tags }}
          build-args: |
            TRAE_SIGNIN_REPO=${{ env.TRAE_SIGNIN_REPO }}
            TRAE_SIGNIN_REF=${{ env.TRAE_SIGNIN_REF }}
            CACHEBUST=${{ steps.prepare.outputs.source-sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Clear
        if: always()
        run: |
          rm -rf ${HOME}/.docker/config.json
